[package]
name = "zodyvel-hook"
version = "0.1.0"
description = "Claude Code ve Codex hook olaylarını Zodyvel adasına taşıyan küçük köprü"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "zodyvel-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
