[package]
name = "tauri-plugin-zkeystore"
version = "0.0.1"
edition = "2021"
description = "Zodyvel telefon: Android Keystore + BiometricPrompt köprüsü (yalnız Rust'tan çağrılır, webview'a açık komut yok)"
links = "tauri-plugin-zkeystore"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
